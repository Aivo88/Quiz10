<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pub Quiz Editor</title>
<link rel="manifest" href="editor-manifest.json">
<meta name="theme-color" content="#191410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pub Quiz Editor">
<link rel="apple-touch-icon" href="apple-touch-icon-editor.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-editor-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-editor-32.png">
<style>
  :root{
    --bg:#191410; --panel:#241c15; --panel2:#2f2418; --line:#463726;
    --ink:#f2e8d5; --muted:#b09a7d; --gold:#f5c542; --goldink:#2a2110;
    --green:#3fae6b; --greenink:#0e2417; --red:#d9534f; --fs:1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #2c2115 0%, var(--bg) 60%);
    color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:calc(17px*var(--fs)); line-height:1.4; padding:0 0 100px; min-height:100vh;
  }
  h1,h2,h3{margin:0; font-weight:800}
  button{font-family:inherit; font-size:1em; cursor:pointer}
  input,select,textarea{font-family:inherit; font-size:1em}

  .topbar{
    position:sticky; top:0; z-index:20; background:rgba(25,20,16,.96);
    backdrop-filter:blur(6px); border-bottom:2px solid var(--line);
    padding:12px clamp(12px,4vw,24px); display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.15em; letter-spacing:.3px}
  .brand .dice{font-size:1.4em}
  .brand small{color:var(--gold); font-weight:700; font-size:.62em; letter-spacing:1px; text-transform:uppercase; display:block; margin-top:-2px}
  .uilang{display:flex; gap:4px}
  .uilang button{background:var(--panel); border:2px solid var(--line); color:var(--muted); border-radius:9px; padding:6px 10px; font-weight:800; font-size:.85em; cursor:pointer}
  .uilang button.on{background:var(--gold); color:var(--goldink); border-color:var(--gold)}
  .corner-panel .uilang{justify-content:center}
  .searchwrap{display:flex; gap:8px; margin-top:12px}
  .searchwrap input{flex:1; background:var(--bg); color:var(--ink); border:2px solid var(--line); border-radius:10px; padding:10px 13px; outline:none}
  .searchwrap input:focus{border-color:var(--gold)}
  .modepick{display:flex; gap:10px}
  .modebtn{flex:1; background:var(--bg); border:2px solid var(--line); color:var(--muted); border-radius:12px; padding:10px; font-weight:700; display:flex; flex-direction:column; gap:1px; align-items:center; cursor:pointer}
  .modebtn b{color:var(--ink); font-size:1.02em}
  .modebtn span{font-size:.78em; opacity:.8}
  .modebtn.on{background:var(--gold); border-color:var(--gold)}
  .modebtn.on b, .modebtn.on span{color:var(--goldink)}
  .pill.bull{color:var(--gold); border-color:#6a5220}
  .spacer{flex:1}
  .wrap{max-width:820px; margin:0 auto; padding:0 clamp(12px,4vw,24px)}

  .btn{
    background:var(--panel); color:var(--ink); border:2px solid var(--line);
    border-radius:12px; padding:11px 16px; font-weight:700; transition:.12s;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover{border-color:var(--gold)}
  .btn.gold{background:var(--gold); color:var(--goldink); border-color:var(--gold)}
  .btn.gold:hover{filter:brightness(1.07)}
  .btn.green{background:var(--green); color:var(--greenink); border-color:var(--green)}
  .btn.danger{color:var(--red); border-color:#5e2b28}
  .btn.danger:hover{border-color:var(--red); background:#2a1917}
  .btn.small{padding:7px 11px; font-size:.85em; border-radius:9px}
  .btn.block{width:100%; justify-content:center}

  .packhead{margin-top:18px; background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:16px}
  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  label.lbl{display:block; color:var(--muted); font-weight:700; font-size:.82em; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px}
  input[type=text], select, textarea{
    width:100%; background:var(--bg); color:var(--ink); border:2px solid var(--line);
    border-radius:10px; padding:11px 13px; outline:none;
  }
  input[type=text]:focus, select:focus, textarea:focus{border-color:var(--gold)}
  textarea{resize:vertical; min-height:64px}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row > *{flex:1; min-width:140px}

  /* language chooser chips */
  .langchips{display:flex; flex-wrap:wrap; gap:8px}
  .langchip{
    background:var(--bg); border:2px solid var(--line); color:var(--muted);
    border-radius:999px; padding:8px 14px; font-weight:700; display:inline-flex; gap:6px; align-items:center;
  }
  .langchip.on{background:var(--gold); color:var(--goldink); border-color:var(--gold)}
  .langchip .fl{font-size:1.05em}

  .tabs{display:flex; gap:8px; margin:18px 0 4px}
  .tab{flex:1; background:var(--panel); border:2px solid var(--line); color:var(--muted); border-radius:12px; padding:12px; font-weight:800; text-align:center}
  .tab.on{background:var(--gold); color:var(--goldink); border-color:var(--gold)}
  .tab .count{opacity:.75}
  .panel{margin-top:14px}
  .hidden{display:none !important}

  .card{background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:10px; display:flex; align-items:center; gap:13px}
  .card .emoji{font-size:1.7em; flex:none; width:1.6em; text-align:center}
  .card .grow{flex:1; min-width:0}
  .card .ttl{font-weight:700; word-break:break-word}
  .card .sub{color:var(--muted); font-size:.82em; margin-top:3px}
  .card .acts{display:flex; gap:7px; flex:none; flex-wrap:wrap; justify-content:flex-end}
  @media(max-width:560px){ .card{flex-wrap:wrap} .card .acts{width:100%; margin-top:4px} }
  .pill{display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:1px 9px; font-size:.76em; color:var(--muted); margin:2px 5px 0 0}
  .pill.correct{color:var(--green); border-color:#2f5a3f}
  .pill.warn{color:#f0b24b; border-color:#6a5220}

  .empty{color:var(--muted); text-align:center; padding:34px 16px; border:2px dashed var(--line); border-radius:14px; line-height:1.6}
  .addbar{position:fixed; left:0; right:0; bottom:0; z-index:50; padding:14px clamp(12px,4vw,24px); background:linear-gradient(transparent, var(--bg) 45%); pointer-events:none; display:flex; justify-content:center}
  .addbar button{pointer-events:auto; width:100%; max-width:820px}

  .emojigrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(46px,1fr)); gap:6px; margin-top:8px; max-height:180px; overflow:auto; padding:4px; background:var(--bg); border:2px solid var(--line); border-radius:10px}
  .emojigrid button{background:transparent; border:2px solid transparent; border-radius:9px; padding:6px 0; font-size:1.5em}
  .emojigrid button:hover{border-color:var(--line)}
  .emojigrid button.sel{border-color:var(--gold); background:var(--panel2)}
  .emojichosen{display:inline-flex; align-items:center; justify-content:center; width:2em; height:2em; font-size:1.5em; background:var(--bg); border:2px solid var(--gold); border-radius:10px}
  .cat-img{ width:1.3em; height:1.3em; object-fit:cover; border-radius:5px; vertical-align:middle; display:inline-block }

  /* language tabs inside editor */
  .langtabs{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px}
  .langtab{background:var(--panel); border:2px solid var(--line); color:var(--muted); border-radius:10px; padding:8px 13px; font-weight:800; display:inline-flex; gap:6px; align-items:center}
  .langtab.on{background:var(--panel2); color:var(--ink); border-color:var(--gold)}
  .langtab .dot{width:8px; height:8px; border-radius:50%; background:#6a5220}
  .langtab.done .dot{background:var(--green)}

  .opt{display:flex; align-items:center; gap:9px; margin-bottom:8px}
  .opt .num{flex:none; width:1.9em; text-align:center; color:var(--muted); font-weight:700}
  .opt input{flex:1}
  .opt .mark{flex:none; padding:9px 12px; border-radius:10px; font-weight:800; background:var(--bg); border:2px solid var(--line); color:var(--muted); white-space:nowrap}
  .opt .mark.on{background:var(--green); color:var(--greenink); border-color:var(--green)}

  .hint{color:var(--muted); font-size:.84em; margin-top:10px; line-height:1.55}
  .warn{color:#f0b24b; font-size:.86em; margin-top:8px; font-weight:600}

  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); opacity:0; transition:.25s; pointer-events:none;
    background:var(--gold); color:var(--goldink); font-weight:800; padding:12px 20px; border-radius:12px; z-index:60; box-shadow:0 10px 30px rgba(0,0,0,.5); max-width:90vw; text-align:center}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .modal-overlay{position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.62); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:20px}
  #modal{z-index:120}
  .modal-box{background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:22px; width:min(440px,100%);
    box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal-msg{font-size:1.05em; line-height:1.5; margin-bottom:16px; white-space:pre-line}
  .modal-box input{width:100%; background:var(--bg); color:var(--ink); border:2px solid var(--line); border-radius:10px;
    padding:12px 14px; outline:none; margin-bottom:16px; font-size:1.05em}
  .modal-box input:focus{border-color:var(--gold)}
  .modal-btns{display:flex; gap:10px}
  .modal-btns .btn{flex:1; justify-content:center; padding:12px}

  .editor-head{display:flex; align-items:center; gap:12px; margin:18px 0 12px}
  .editor-head h2{flex:1}
  hr.sep{border:none; border-top:2px solid var(--line); margin:16px 0}
  .savebar{position:sticky; bottom:0; background:linear-gradient(transparent, var(--bg) 30%); padding:16px 0 6px; display:flex; gap:10px}
  .savebar .btn{flex:1; justify-content:center}
  .catlang{margin-bottom:9px}
  .catlang .lbl{margin-bottom:4px}

  /* Left corner: flags + update + version */
  .corner-panel{
    position:fixed; top:76px; left:14px; z-index:15; width:150px;
    display:flex; flex-direction:column; gap:8px; align-items:stretch;
    background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:11px;
  }
  .corner-panel .cp-flags{font-size:1.25em; text-align:center; letter-spacing:.08em; min-height:1.3em; font-weight:800}
  .corner-panel .btn{justify-content:center; font-size:.8em}
  .corner-panel .cp-ver{text-align:center; color:var(--muted); font-weight:700; font-size:.82em; letter-spacing:.5px}
  @media(max-width:1180px){
    .corner-panel{position:static; width:auto; flex-direction:row; align-items:center; justify-content:center;
      max-width:820px; margin:12px auto 0; }
    .corner-panel .cp-flags{min-height:0}
    .corner-panel .btn{flex:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dice">🎲</span><span>Pub Quiz<small data-i18n="brandSub">Editori</small></span></div>
  <div class="spacer"></div>
  <button class="btn small" id="importBtn" data-i18n="import">📂 Tuo</button>
  <button class="btn small gold" id="exportBtn" data-i18n="export">💾 Vie paketti</button>
  <input type="file" id="fileInput" accept="application/json,.json" hidden>
</div>

<div class="corner-panel" id="cornerPanel">
  <div class="uilang" id="uiLangSel"></div>
  <button class="btn small" id="updateBtn" data-i18n="update">🔄 Tarkista päivitykset</button>
  <div class="cp-ver" id="cpVer">v01.00.00</div>
</div>

<!-- MAIN -->
<div id="mainView">
  <div class="wrap">
    <div class="packhead">
      <div class="field">
        <label class="lbl" for="packName" data-i18n="packName">Paketin nimi</label>
        <input type="text" id="packName" placeholder="">
      </div>
      <div class="field">
        <label class="lbl" data-i18n="packLangs">Paketin kielet — valitse mitkä kielet paketti sisältää</label>
        <div class="langchips" id="langChips"></div>
      </div>
      <div class="field">
        <label class="lbl" data-i18n="packModeLbl">Pelimuoto (koko paketti)</label>
        <div class="modepick" id="packModePick">
          <button type="button" class="modebtn" data-pmode="sweep"><b data-i18n="modeSweep">Sweep</b><span data-i18n="modeSweepDesc">monta oikein</span></button>
          <button type="button" class="modebtn" data-pmode="bullseye"><b data-i18n="modeBullseye">Bullseye</b><span data-i18n="modeBullseyeDesc">yksi oikein</span></button>
      </div>
      <div class="field">
        <button class="btn danger block" id="clearAllBtn" data-i18n="clearAll">🗑 Tyhjennä kaikki</button>
      </div>
      <p class="hint" data-i18n="hint">Kirjoita jokainen kysymys valitsemillasi kielillä.</p>
    </div>

    <div class="tabs">
      <div class="tab on" id="tabQuestions"><span data-i18n="tabQuestions">Kysymykset</span> <span class="count" id="qCount">(0)</span></div>
      <div class="tab" id="tabCategories"><span data-i18n="tabCategories">Kategoriat</span> <span class="count" id="cCount">(0)</span></div>
    </div>
    <div class="searchwrap"><input type="text" id="searchBox" data-i18n-ph="searchPh" placeholder="Etsi…"><button id="searchClear" class="btn small" style="display:none">✕</button></div>

    <div class="panel" id="panelQuestions">
      <div id="questionList"></div>
      <div class="addbar"><button class="btn gold block" id="addQuestionBtn" data-i18n="newQuestion">➕ Uusi kysymys</button></div>
    </div>

    <div class="panel hidden" id="panelCategories">
      <div id="categoryList"></div>
      <div class="addbar"><button class="btn gold block" id="addCategoryBtn" data-i18n="newCategory">➕ Uusi kategoria</button></div>
    </div>
  </div>
</div>

<!-- CATEGORY QUESTIONS VIEW -->
<div id="catQuestions" class="hidden">
  <div class="wrap">
    <div class="editor-head">
      <button class="btn small" id="cqBack" data-i18n="back">‹ Takaisin</button>
      <h2 id="cqTitle"></h2>
    </div>
    <div id="cqList"></div>
    <div class="addbar"><button class="btn gold block" id="cqAdd" data-i18n="newQuestion">➕ Uusi kysymys</button></div>
  </div>
</div>

<!-- CATEGORY EDITOR -->
<div id="catEditor" class="hidden">
  <div class="wrap">
    <div class="editor-head">
      <button class="btn small" id="catBack" data-i18n="back">‹ Takaisin</button>
      <h2 id="catEditorTitle">Uusi kategoria</h2>
    </div>
    <div class="field" id="catNameFields">
      <label class="lbl" data-i18n="catNameLbl">Kategorian nimi (jokaisella kielellä)</label>
      <div id="catNameInputs"></div>
    </div>
    <div class="field">
      <label class="lbl" data-i18n="iconLbl">Kuvake</label>
      <div style="display:flex; align-items:center; gap:12px">
        <span class="emojichosen" id="catEmojiChosen">🎵</span>
        <input type="text" id="catEmojiCustom" data-i18n-ph="ownEmoji" placeholder="oma emoji" maxlength="4" style="flex:1; max-width:200px">
        <label class="btn" style="cursor:pointer; white-space:nowrap">📷 <span data-i18n="chooseImage">Valitse kuva</span><input type="file" id="catImgInput" accept="image/*" hidden></label>
      </div>
      <div class="emojigrid" id="emojiGrid"></div>
    </div>
    <div class="savebar">
      <button class="btn" id="catCancel" data-i18n="cancel">Peruuta</button>
      <button class="btn green" id="catSave" data-i18n="saveCat">Tallenna kategoria</button>
    </div>
  </div>
</div>

<!-- QUESTION EDITOR -->
<div id="qEditor" class="hidden">
  <div class="wrap">
    <div class="editor-head">
      <button class="btn small" id="qBack" data-i18n="back">‹ Takaisin</button>
      <h2 id="qEditorTitle">Uusi kysymys</h2>
    </div>
    <div class="row">
      <div class="field"><label class="lbl" for="qCat" data-i18n="category">Kategoria</label><select id="qCat"></select></div>
      <div class="field"><label class="lbl" for="qDiff" data-i18n="difficulty">Vaikeustaso</label>
        <select id="qDiff"><option value="easy" data-i18n="easy">Helppo</option><option value="normal" selected data-i18n="normal">Normaali</option><option value="hard" data-i18n="hard">Vaikea</option></select></div>
    </div>
    <div class="field hidden">
      <label class="lbl" data-i18n="modeLbl">Pelimuoto</label>
      <div class="modepick" id="qModePick">
        <button type="button" class="modebtn on" data-qmode="sweep"><b data-i18n="modeSweep">Sweep</b><span data-i18n="modeSweepDesc">monta oikein</span></button>
        <button type="button" class="modebtn" data-qmode="bullseye"><b data-i18n="modeBullseye">Napakymppi</b><span data-i18n="modeBullseyeDesc">yksi oikein</span></button>
      </div>
    </div>
    <label class="lbl" data-i18n="qLangLbl">Kieli — täytä kysymys jokaisella kielellä</label>
    <div class="langtabs" id="qLangTabs"></div>
    <div class="field"><label class="lbl" for="qText"><span data-i18n="question">Kysymys</span> (<span id="qActiveLangName"></span>)</label><textarea id="qText" placeholder=""></textarea></div>
    <hr class="sep">
    <label class="lbl"><span data-i18n="optionsLbl">Vaihtoehdot</span> (<span id="qActiveLangName2"></span>) <span data-i18n="optionsHead">— merkitse oikeat vihreällä (1–9 oikeaa)</span></label>
    <p class="hint" style="margin-top:2px" data-i18n="optionsHint">Oikein/väärin on sama kaikilla kielillä — käännä vain tekstit.</p>
    <div id="optList"></div>
    <p class="warn hidden" id="qWarn"></p>
    <div class="savebar">
      <button class="btn" id="qCancel" data-i18n="cancel">Peruuta</button>
      <button class="btn green" id="qSave" data-i18n="saveQuestion">Tallenna kysymys</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay hidden" id="modal">
  <div class="modal-box">
    <div class="modal-msg" id="modalMsg"></div>
    <input type="text" id="modalInput" class="hidden">
    <div class="modal-btns">
      <button class="btn" id="modalCancel">Peruuta</button>
      <button class="btn green" id="modalOk">OK</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="langModal">
  <div class="modal-box">
    <div class="modal-msg" id="langModalTitle"></div>
    <label class="lbl" data-i18n="langNameLbl" style="margin-top:0">Nimi</label>
    <input type="text" id="lmName">
    <label class="lbl" data-i18n="langCodeLbl">Koodi</label>
    <input type="text" id="lmCode" maxlength="3" autocomplete="off" autocapitalize="off" spellcheck="false" style="text-transform:lowercase">
    <label class="lbl" data-i18n="iconLbl">Kuvake</label>
    <div style="display:flex; align-items:center; gap:10px">
      <span class="emojichosen" id="lmFlagChosen">🏳️</span>
      <input type="text" id="lmFlag" maxlength="8" data-i18n-ph="ownEmoji" placeholder="oma emoji" style="flex:1">
    </div>
    <div class="emojigrid" id="lmEmojiGrid"></div>
    <p class="warn hidden" id="lmWarn"></p>
    <div class="modal-btns" style="margin-top:14px">
      <button class="btn danger hidden" id="lmDelete" data-i18n="del">Poista</button>
      <button class="btn" id="lmCancel" data-i18n="cancel">Peruuta</button>
      <button class="btn green" id="lmSave" data-i18n="save">Tallenna</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const LS_KEY = 'pubquiz_editor_pack_v2';
const LS_UILANG = 'pubquiz_editor_uilang';

/* ---- UI translations (editor's own interface language) ---- */
const I18N = {
  fi:{
    brandSub:'Editor', import:'📂 Tuo', export:'💾 Vie paketti', update:'🔄 Tarkista päivitykset',
    packName:'Paketin nimi', packModeLbl:'Pelimuoto (koko paketti)', tPackMode:m=>`Paketin pelimuoto: `, tPackToBull:'Osa kysymyksistä ei ole yksi-oikea. Vaihda silti Bullseye-muotoon?', packLangs:'Paketin kielet — valitse mitkä kielet paketti sisältää',
    clearAll:'🗑 Tyhjennä kaikki',
    hint:'Kirjoita jokainen kysymys valitsemillasi kielillä (kielivälilehdet kysymysnäkymässä). Kun paketti on valmis, paina <b>Vie paketti</b> ja tuo .json Pub Quiz -peliin (Asetukset → Kysymykset → Lataa tiedostosta). Jos paketissa on peliin uusi kieli, se lisätään pelin kielivalikkoon automaattisesti.',
    tabQuestions:'Kysymykset', tabCategories:'Kategoriat',
    newQuestion:'➕ Uusi kysymys', newCategory:'➕ Uusi kategoria',
    back:'‹ Takaisin', catNew:'Uusi kategoria', catEdit:'Muokkaa kategoriaa',

/* Themed replacements for native confirm()/prompt() so the browser never shows its "prevent dialogs" box */
let modalResolve=null, modalIsPrompt=false;
function showModal(msg, isPrompt, def){
  return new Promise(resolve=>{
    modalResolve=resolve; modalIsPrompt=isPrompt;
    $('#modalMsg').textContent = msg;
    const inp=$('#modalInput');
    if(isPrompt){ inp.classList.remove('hidden'); inp.value = def==null?'':def; } else inp.classList.add('hidden');
    $('#modalOk').textContent = 'OK';
    $('#modalCancel').textContent = t('cancel');
    $('#modal').classList.remove('hidden');
    setTimeout(()=>{ isPrompt ? inp.focus() : $('#modalOk').focus(); }, 40);
  });
}
function closeModal(val){ $('#modal').classList.add('hidden'); const r=modalResolve; modalResolve=null; if(r) r(val); }
function uiConfirm(msg){ return showModal(msg, false); }
function uiPrompt(msg, def){ return showModal(msg, true, def); }
$('#modalOk').addEventListener('click', ()=>closeModal(modalIsPrompt ? $('#modalInput').value : true));
$('#modalCancel').addEventListener('click', ()=>closeModal(modalIsPrompt ? null : false));
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(modalIsPrompt?null:false); });
$('#modalInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); closeModal($('#modalInput').value); } else if(e.key==='Escape') closeModal(null); });
document.addEventListener('keydown', e=>{ if(!$('#modal').classList.contains('hidden') && e.key==='Escape') closeModal(modalIsPrompt?null:false); });

// migrate old single-language format (v1) to multilingual (v2)
function migrate(p){
  if(p && !p.mode){ const qs=p.questions||[]; p.mode=(qs.length && qs.every(q=>q.mode==='bullseye'))?'bullseye':'sweep'; }
  if(!p) return p;
  if(Array.isArray(p.langs) && p.topics && p.topics[0] && p.topics[0].names){ if(!p.customLangs)p.customLangs=[]; return p; } // already v2
  const lc = p.lang || 'fi';
  const topics = (p.topics||[]).map(t=>({ key:t.key, icon:t.icon, names:{[lc]: t.name||''} }));
  const questions = (p.questions||[]).map(q=>({
    id:q.id, topic:q.topic, d:q.d,
    q:{[lc]: q.q||''},
    opts:(q.opts||[]).map(o=>({ t:{[lc]: o.t||''}, correct:!!o.correct }))
  }));
  return { name:p.name||'', langs:[lc], customLangs:[], topics, questions };
}

function renderLangChips(){
  const chips = allLangList().map(l=>{
    const custom = (pack.customLangs||[]).some(c=>c.code===l.code);
    return `<button class="langchip ${pack.langs.includes(l.code)?'on':''}" data-lang="${l.code}"><span class="fl">${l.flag}</span>${esc(l.name)}${custom?` <span class="editlang" data-editlang="${l.code}" style="opacity:.7; padding:0 3px">✎</span>`:''}</button>`;
  }).join('');
  $('#langChips').innerHTML = chips + `<button class="langchip" id="addLangChip" style="border-style:dashed">${t("addOwnLang")}</button>`;
}
$('#langChips').addEventListener('click', e=>{
  const pen=e.target.closest('[data-editlang]'); if(pen){ e.stopPropagation(); openLangModal(pen.dataset.editlang); return; }
  if(e.target.closest('#addLangChip')){ openAddLang(); return; }
  const b=e.target.closest('[data-lang]'); if(!b) return;
  const code=b.dataset.lang;
  if(pack.langs.includes(code)){
    if(pack.langs.length===1){ toast(t('tMustOneLang')); return; }
    pack.langs = pack.langs.filter(c=>c!==code);
  } else {
    pack.langs.push(code);
  }
  save(); renderLangChips();
});

function migrateLangCode(oldC, newC){
  const mv=obj=>{ if(obj && obj[oldC]!=null){ obj[newC]=obj[oldC]; delete obj[oldC]; } };
  pack.langs = pack.langs.map(c=>c===oldC?newC:c);
  pack.topics.forEach(tp=>mv(tp.names));
  pack.questions.forEach(q=>{ mv(q.q); (q.opts||[]).forEach(o=>mv(o.t)); });
}

$('#lmSave').addEventListener('click', ()=>{
  const warn=$('#lmWarn');
  const nm=$('#lmName').value.trim();
  const code=$('#lmCode').value.trim().toLowerCase();
  const flag=$('#lmFlag').value.trim() || '🏳️';
  const fail=m=>{ warn.textContent=m; warn.classList.remove('hidden'); };
  if(!nm) return fail(t('tNeedLangName'));
  if(!/^[a-z]{2,3}$/.test(code)) return fail(t('tBadCode'));            // stays open, lets you fix it
  if(code!==lmEditingCode && LMETA[code]) return fail(t('tCodeUsed'));
  if(lmEditingCode){
    const l=pack.customLangs.find(c=>c.code===lmEditingCode);
    if(code!==lmEditingCode) migrateLangCode(lmEditingCode, code);
    l.code=code; l.name=nm; l.flag=flag;
  } else {
    pack.customLangs.push({code, name:nm, flag});
    if(!pack.langs.includes(code)) pack.langs.push(code);
  }
  rebuildLMeta(); save(); renderLangChips(); closeLangModal();
  toast(lmEditingCode ? t('tLangUpdated') : t('tLangAdded', nm));
});
$('#lmDelete').addEventListener('click', async ()=>{
  if(!lmEditingCode) return;
  const l=pack.customLangs.find(c=>c.code===lmEditingCode);
  if(!(await uiConfirm(t('cDelLang', l?l.name:lmEditingCode)))) return;
  pack.customLangs=pack.customLangs.filter(c=>c.code!==lmEditingCode);
  pack.langs=pack.langs.filter(c=>c!==lmEditingCode);
  if(!pack.langs.length) pack.langs=['fi'];
  rebuildLMeta(); save(); renderLangChips(); closeLangModal(); toast(t('tLangDeleted'));
});

/* search */
function matchesQ(q){
  const s=searchTerm.trim().toLowerCase(); if(!s) return true;
  if(Object.values(q.q||{}).some(v=>String(v).toLowerCase().includes(s))) return true;
  if((q.opts||[]).some(o=>Object.values(o.t||{}).some(v=>String(v).toLowerCase().includes(s)))) return true;
  if(String(catName(q.topic)).toLowerCase().includes(s)) return true;
  return false;
}
function matchesCat(tp){
  const s=searchTerm.trim().toLowerCase(); if(!s) return true;
  return Object.values(tp.names||{}).some(v=>String(v).toLowerCase().includes(s));
}
$('#searchBox').addEventListener('input', e=>{
  searchTerm = e.target.value;
  $('#searchClear').style.display = searchTerm ? '' : 'none';
  render();
});
$('#searchClear').addEventListener('click', ()=>{ searchTerm=''; $('#searchBox').value=''; $('#searchClear').style.display='none'; render(); });

/* helpers */
function firstLang(){ return pack.langs[0]||'fi'; }
function dispName(names){ if(!names) return ''; return names[UILANG] || names[firstLang()] || names[Object.keys(names)[0]] || ''; }
function iconHtmlE(ic){ ic=ic||'📦'; if(typeof ic==='string'&&ic.slice(0,5)==='data:') return '<img class="cat-img" alt="" src="'+ic+'">'; return esc(ic); }
function catName(key){ const c=pack.topics.find(t=>t.key===key); if(!c) return t('deletedCat'); return dispName(c.names) || t('noName'); }
function catIcon(key){ const c=pack.topics.find(t=>t.key===key); return c?c.icon:'❓'; }
function qFilledLangs(q){ return pack.langs.filter(c => (q.q[c]||'').trim() && q.opts.length===10 && q.opts.every(o=>(o.t[c]||'').trim())); }

function render(){
  $('#packName').value = pack.name||'';
  if(typeof renderPackMode==='function') renderPackMode();
  renderLangChips();
  $('#qCount').textContent=`(${pack.questions.length})`;
  $('#cCount').textContent=`(${pack.topics.length})`;

  const term = (searchTerm||'').trim().toLowerCase();
  const cats = term ? pack.topics.filter(matchesCat) : pack.topics;
  const qs = term ? pack.questions.filter(matchesQ) : pack.questions;

  const cl=$('#categoryList');
  cl.innerHTML = !pack.topics.length
    ? `<div class="empty">${t("emptyCats")}</div>`
    : (!cats.length ? `<div class="empty">${t("noMatch")}</div>`
    : cats.map(tp=>{
        const n=pack.questions.filter(q=>q.topic===tp.key).length;
        return `<div class="card"><span class="emoji">${iconHtmlE(tp.icon)}</span>
          <div class="grow" data-viewcat="${tp.key}" style="cursor:pointer"><div class="ttl">${esc(catName(tp.key))}</div><div class="sub">${t("nQuestions",n)} ›</div></div>
          <div class="acts"><button class="btn small green" data-addq="${tp.key}">${t("addQ")}</button>
          <button class="btn small" data-editcat="${tp.key}">${t("edit")}</button>
          <button class="btn small danger" data-delcat="${tp.key}">${t("del")}</button></div></div>`;
      }).join(''));

  const ql=$('#questionList');
  ql.innerHTML = !pack.questions.length
    ? `<div class="empty">${t("emptyQs")}</div>`
    : (!qs.length ? `<div class="empty">${t("noMatch")}</div>`
    : qs.map(q=>{
        const correct=q.opts.filter(o=>o.correct).length;
        const done=qFilledLangs(q);
        const langPills = pack.langs.map(c=>`<span class="pill ${done.includes(c)?'correct':'warn'}">${fl(c)} ${c.toUpperCase()}</span>`).join('');
        return `<div class="card"><span class="emoji">${iconHtmlE(catIcon(q.topic))}</span>
          <div class="grow"><div class="ttl">${esc(q.q[UILANG]||q.q[firstLang()]||q.q[done[0]]||'—')}</div>
          <div class="sub"><span class="pill">${esc(catName(q.topic))}</span><span class="pill ${q.mode==='bullseye'?'bull':''}">${q.mode==='bullseye'?t('modeBullseye'):t('modeSweep')}</span><span class="pill">${t(q.d)}</span><span class="pill correct">${t("nCorrect",correct)}</span>${langPills}</div></div>
          <div class="acts"><button class="btn small" data-editq="${q.id}">${t("edit")}</button>
          <button class="btn small danger" data-delq="${q.id}">${t("del")}</button></div></div>`;
      }).join(''));
  save();
}

function openQ(id, presetCat){
  editingQId=id;
  const q=id?pack.questions.find(x=>x.id===id):null;
  // build working draft with all pack languages present
  qDraft = { mode: pack.mode||'sweep', q:{}, opts:Array.from({length:10},()=>({t:{},correct:false})) };
  pack.langs.forEach(c=>{ qDraft.q[c] = q? (q.q[c]||'') : ''; });
  for(let i=0;i<10;i++){
    const src = q && q.opts[i];
    qDraft.opts[i].correct = src?!!src.correct:false;
    pack.langs.forEach(c=>{ qDraft.opts[i].t[c] = src? (src.t[c]||'') : ''; });
  }
  $('#qEditorTitle').textContent = q?t('qEdit'):t('qNew');
  fillCatSelect(q?q.topic:(presetCat||pack.topics[0].key));
  $('#qDiff').value = q?q.d:'normal';
  qActiveLang = pack.langs[0];
  $$('#qModePick .modebtn').forEach(x=>x.classList.toggle('on', x.dataset.qmode===qDraft.mode));
  renderLangTabs();
  loadLangIntoFields();
  // correct marks (shared)
  $$('#optList [data-mark]').forEach((b,i)=>{ const on=qDraft.opts[i].correct; b.classList.toggle('on',on); b.textContent=on?t('right'):t('wrong'); });
  $('#qWarn').classList.add('hidden');
  show('q'); setTimeout(()=>$('#qText').focus(),60);
}

    const filled = (qDraft.q[c]||'').trim() && qDraft.opts.every(o=>(o.t[c]||'').trim());
    return `<button class="langtab ${c===qActiveLang?'on':''} ${filled?'done':''}" data-qlang="${c}"><span class="dot"></span>${fl(c)} ${esc(LMETA[c].name)}</button>`;
  }).join('');
}

$('#qSave').addEventListener('click', ()=>{
  saveFieldsIntoDraft();
  // read correct marks
  $$('#optList [data-mark]').forEach((b,i)=>{ qDraft.opts[i].correct=b.classList.contains('on'); });
  const correct=qDraft.opts.filter(o=>o.correct).length;
  const warn=$('#qWarn');
  if(qDraft.mode==='bullseye'){ if(correct!==1){ warn.textContent=t('tBull1'); warn.classList.remove('hidden'); return; } }
  else if(correct<1||correct>9){ warn.textContent=t('tMark19'); warn.classList.remove('hidden'); return; }
  // require at least one fully-filled language
  const filledLangs = pack.langs.filter(c=>(qDraft.q[c]||'').trim() && qDraft.opts.every(o=>(o.t[c]||'').trim()));
  if(!filledLangs.length){ warn.textContent=t('tFillOne'); warn.classList.remove('hidden'); return; }
  const rec = { mode:pack.mode||'sweep', topic:$('#qCat').value, d:$('#qDiff').value, q:{...qDraft.q}, opts:qDraft.opts.map(o=>({t:{...o.t}, correct:o.correct})) };
  if(editingQId){ const q=pack.questions.find(x=>x.id===editingQId); Object.assign(q,rec); }
  else pack.questions.push({ id:uid('q_'), ...rec });
  save();
  const miss = pack.langs.length - filledLangs.length;
  toast(miss>0 ? t('tSavedPartial',miss) : t('tQSaved'));
  closeQ();
});

/* export */
function buildPack(){
  const langs = pack.langs.slice();
  const needEn = !langs.includes('en');
  const topics = pack.topics.map(t=>{
    const o={key:t.key, icon:t.icon};
    langs.forEach(c=>{ if((t.names[c]||'').trim()) o[c]=t.names[c].trim(); });
    if(needEn) o.en = (t.names[langs[0]]||t.key).trim();
    return o;
  });
  const questions=[];
  pack.questions.forEach(q=>{
    const correct=q.opts.filter(o=>o.correct).length;
    const mode=(pack.mode==='bullseye')?'bullseye':'sweep';
    if(mode==='bullseye'){ if(correct!==1) return; } else if(correct<1||correct>9) return;
    const L = langs.filter(c=>(q.q[c]||'').trim() && q.opts.every(o=>(o.t[c]||'').trim()));
    if(!L.length) return;
    const cat={}; L.forEach(c=>cat[c]=q.q[c].trim());
    if(cat.en==null) cat.en=cat[L[0]];
    const o=q.opts.map(op=>{ const row=L.map(c=>op.t[c].trim()); row.push(op.correct?1:0); return row; });
    questions.push({ mode, topic:q.topic, d:q.d, cat, o, L });
  });
  return { name:pack.name||'Oma paketti', langs:langs.map(c=>({code:c, flag:LMETA[c].flag, name:LMETA[c].name})), topics, questions };
}
$('#exportBtn').addEventListener('click', async ()=>{
  if(!pack.questions.length){ toast(t('tNeedQ')); return; }
  if(!(pack.name||'').trim()){
    const nm = await uiPrompt(t('pPackName'), t('defPackName'));
    if(nm==null) return;                 // cancelled
    pack.name = nm.trim() || t('defPackName');
    $('#packName').value = pack.name; save();
  }
  const out=buildPack();
  if(!out.questions.length){ toast(t('tNoComplete')); return; }
  const skipped = pack.questions.length - out.questions.length;
  if(skipped>0 && !await uiConfirm(t('cSkip',skipped))) return;
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const safe=(pack.name||'pub-quiz-paketti').replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase()||'pub-quiz-paketti';
  a.href=URL.createObjectURL(blob); a.download=safe+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(t('tExported',out.questions.length));
});

/* import (reads multilingual packs back in) */
$('#importBtn').addEventListener('click', ()=>$('#fileInput').click());
$('#fileInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=async ()=>{ try{
    const data=JSON.parse(String(r.result));
    const arr=Array.isArray(data)?data:(data.questions||[]);
    if(!arr.length && !(data.topics||[]).length){ toast(t('tNoQInFile')); return; }
    if(!await uiConfirm(t('cImport'))) return;
    importPack(data, arr); toast(t('tImported',pack.questions.length));
  }catch(err){ toast(t('tBadJson')); } };
  r.readAsText(f); e.target.value='';
});
function importPack(data, arr){
  let langs = Array.isArray(data.langs)&&data.langs.length
    ? data.langs.map(l=>String(typeof l==='string'?l:l.code).toLowerCase()).filter(c=>LMETA[c])
    : null;
  if(!langs || !langs.length){
    const set=[]; arr.forEach(q=>{ (Array.isArray(q.L)?q.L:Object.keys(q.cat||{})).forEach(c=>{ if(LMETA[c]&&!set.includes(c))set.push(c); }); });
    langs = set.length?set:['en'];
  }
  const topics=(data.topics||[]).map(t=>{ const names={}; langs.forEach(c=>{ if(typeof t[c]==='string')names[c]=t[c]; }); if(!Object.keys(names).length && t.en)names[langs[0]]=t.en; return { key:t.key||uid('cat_'), icon:t.icon||'📦', names }; });
  const byKey={}; topics.forEach(t=>byKey[t.key]=t);
  const questions=arr.map(q=>{
    const L=(Array.isArray(q.L)&&q.L.length)?q.L:(langs.length?langs:['en']);
    const qt={}; langs.forEach(c=>{ if(q.cat && typeof q.cat[c]==='string') qt[c]=q.cat[c]; });
    if(!Object.keys(qt).length && q.cat && q.cat.en) qt[langs[0]]=q.cat.en;
    const opts=(q.o||[]).map(o=>{ const t={}; langs.forEach(c=>{ const idx=L.indexOf(c); if(idx>=0 && typeof o[idx]==='string')t[c]=o[idx]; }); return { t, correct:o[o.length-1]===1 }; });
    while(opts.length<10) opts.push({t:{},correct:false});
    let topic=q.topic; if(!byKey[topic]){ const nk=topic||uid('cat_'); byKey[nk]={key:nk,icon:'📦',names:{[langs[0]]:nk}}; topics.push(byKey[nk]); topic=nk; }
    return { id:uid('q_'), mode:q.mode==='bullseye'?'bullseye':'sweep', topic, d:['easy','normal','hard'].includes(q.d)?q.d:'normal', q:qt, opts:opts.slice(0,10) };
  });
  pack={ name:data.name||'', langs, topics, questions };
  save(); render();
}

/* clear */
$('#clearAllBtn').addEventListener('click', async ()=>{
  if(!await uiConfirm(t('cClearAll'))) return;
  pack={ name:'', langs:pack.langs.slice(), customLangs:pack.customLangs||[], topics:defaultTopics(), questions:[] }; save(); render(); toast(t('tCleared'));
});

/* corner panel: flag row + update */
function renderCornerFlags(){
  const el = $('#cpFlags'); if(!el) return;
  el.innerHTML = pack.langs.map(c=>{
    const m = LMETA[c]; const flag = m ? m.flag : '🏳️';
    return FLAG_OK ? flag : `<span style="color:var(--gold)">${(c||'').toUpperCase()}</span>`;
  }).join(FLAG_OK ? ' ' : ' ');
}
let updating=false;
async function checkUpdate(){
  if(updating) return; updating=true;
  const btn=$('#updateBtn'); const old=btn.textContent; btn.textContent=t('tChecking');
  try{
    // Read our own file fresh and pull the version out of it — no separate version file needed.
    const r = await fetch(location.pathname + '?ts=' + Date.now(), {cache:'no-store'});
    const html = await r.text();
    const m = html.match(/EDITOR_VERSION\s*=\s*'([^']+)'/);
    const remote = m ? m[1] : '';
    if(remote && remote!==EDITOR_VERSION){
      toast(t('tNewVer',remote));
      setTimeout(()=>{ location.replace(location.pathname + '?v=' + encodeURIComponent(remote)); }, 700);
      return;
    }
    toast(t('tLatest',EDITOR_VERSION));
  }catch(e){
    toast(t('tUpdFail'));
  }
  btn.textContent=old; updating=false;
}
$('#updateBtn').addEventListener('click', checkUpdate);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('editor-sw.js').catch(()=>{}); }

/* UI language */
function renderUILangSel(){
  const el=$('#uiLangSel'); if(!el) return;
  el.innerHTML = UI_LANGS.map(l=>`<button data-uilang="${l.code}" class="${l.code===UILANG?'on':''}">${FLAG_OK?l.flag:l.code.toUpperCase()}</button>`).join('');
}
function applyUILang(){
  document.documentElement.lang = UILANG;
  document.title = 'Pub Quiz – ' + t('brandSub');
  $$('[data-i18n]').forEach(el=>{ el.innerHTML = t(el.dataset.i18n); });
  $$('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
  renderUILangSel();
  render();
  if(catView) renderCatQ();
  // dynamic titles that depend on new/edit state — refresh them if their editor is open
  if(!$('#catEditor').classList.contains('hidden')) $('#catEditorTitle').textContent = editingCatId?t('catEdit'):t('catNew');
  if(!$('#qEditor').classList.contains('hidden')) $('#qEditorTitle').textContent = editingQId?t('qEdit'):t('qNew');
}
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-uilang]'); if(!b) return;
  UILANG=b.dataset.uilang; try{ localStorage.setItem(LS_UILANG,UILANG); }catch(_){}
  applyUILang();
});

/* boot */
FLAG_OK = detectFlag();
$('#cpVer').textContent = 'v'+EDITOR_VERSION;
buildEmojiGrid(); buildLangEmojiGrid(); buildOptRows(); applyUILang(); render();
</script>
