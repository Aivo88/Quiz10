<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pub Quiz — Multiplayer</title>
<style>

  :root{
    --fs:1;                 /* font scale (settings) */
    --grad:#1c2647;         /* background glow */
    --bg:#0E1428;
    --bg2:#0A0F1F;
    --panel:#18213B;
    --panel2:#1F2A49;
    --line:#2C3A5F;
    --ink:#F5F1E6;
    --muted:#8A93AD;
    --gold:#F2B138;
    --gold-dim:#9c7526;
    --good:#34D399;
    --bad:#F05252;
    --focus:#FFE08A;
    --p1:#F2B138; --p2:#34D399; --p3:#57B9FF; --p4:#F472B6;
    --p5:#A78BFA; --p6:#FB923C; --p7:#2DD4BF; --p8:#F87171;
  }
  /* ---- Colour themes ---- */
  body[data-theme="forest"]{
    --grad:#123024; --bg:#0C1F17; --bg2:#08140F; --panel:#14352A; --panel2:#1B4636;
    --line:#2C5C48; --ink:#F1F6EF; --muted:#8FB0A0; --gold:#E7B24A; --gold-dim:#8f6f2c;
    --good:#4ADE80; --bad:#F87171; --focus:#F4D98A;
  }
  body[data-theme="neon"]{
    --grad:#1a1030; --bg:#08060F; --bg2:#040308; --panel:#160F28; --panel2:#241640;
    --line:#3B2A66; --ink:#F5F0FF; --muted:#9A8BC2; --gold:#F5C542; --gold-dim:#9c7a1f;
    --good:#22E6A5; --bad:#FF4D6D; --focus:#7CF9FF;
    --p1:#F5C542; --p2:#22E6A5; --p3:#4CC9FF; --p4:#FF6FD8; --p5:#B18CFF; --p6:#FF9E45; --p7:#3DF5D0; --p8:#FF5C7A;
  }
  body[data-theme="light"]{
    --grad:#e9eef7; --bg:#F3F5FA; --bg2:#E4E9F2; --panel:#FFFFFF; --panel2:#EDF1F8;
    --line:#CBD5E6; --ink:#1C2540; --muted:#6B7690; --gold:#D69422; --gold-dim:#b07a1a;
    --good:#159C6B; --bad:#D6453F; --focus:#E0A93A;
    --p1:#C88413; --p2:#159C6B; --p3:#2C7BD6; --p4:#D24C97; --p5:#7A5CE0; --p6:#E07A1F; --p7:#159A8F; --p8:#D6453F;
  }
  body[data-theme="ocean"]{
    --grad:#0c2a3a; --bg:#08202E; --bg2:#05161F; --panel:#0F3346; --panel2:#164459;
    --line:#245D73; --ink:#EAF6FB; --muted:#88AEC0; --gold:#4FC3E8; --gold-dim:#2b7f9c;
    --good:#3FE0C5; --bad:#FF6B6B; --focus:#9EE7FF;
  }
  body[data-theme="sunset"]{
    --grad:#3a1330; --bg:#2A1226; --bg2:#1A0A18; --panel:#3D1C34; --panel2:#4F2743;
    --line:#6B3A5A; --ink:#FDEEE6; --muted:#C89FB4; --gold:#FF9E45; --gold-dim:#b06a24;
    --good:#57E0A6; --bad:#FF5C7A; --focus:#FFC58A;
  }
  body[data-theme="grape"]{
    --grad:#241442; --bg:#1A0F33; --bg2:#0F0820; --panel:#271847; --panel2:#33205C;
    --line:#463075; --ink:#F1EBFF; --muted:#A99AD0; --gold:#C9A0FF; --gold-dim:#7d5bb0;
    --good:#4ADE80; --bad:#FF6B9A; --focus:#DCC6FF;
  }
  body[data-theme="mono"]{
    --grad:#141414; --bg:#0A0A0A; --bg2:#000000; --panel:#161616; --panel2:#222222;
    --line:#3A3A3A; --ink:#FFFFFF; --muted:#9A9A9A; --gold:#FFD400; --gold-dim:#a08a00;
    --good:#00E676; --bad:#FF3B30; --focus:#FFEB3B;
  }
  body[data-theme="sepia"]{
    --grad:#efe3cf; --bg:#F3E9D6; --bg2:#E6D8BF; --panel:#FBF4E6; --panel2:#F0E6D0;
    --line:#D8C6A2; --ink:#3B2E1E; --muted:#8A7A5E; --gold:#B5791F; --gold-dim:#8f5f16;
    --good:#2E8B57; --bad:#C0392B; --focus:#D8A63A;
    --p1:#A9701A; --p2:#2E8B57; --p3:#2C6FB0; --p4:#B0417F; --p5:#6B4FB0; --p6:#C06A1A; --p7:#158080; --p8:#C0392B;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 120% at 50% -10%, var(--grad) 0%, var(--bg) 45%, var(--bg2) 100%);
    color:var(--ink);
    font-family:"Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  /* Overscan-safe stage for TVs */
  #stage{
    position:fixed; inset:0;
    padding:1.5vh 1.8vw;
    display:flex; flex-direction:column;
    transform:scale(var(--scale,1));
    transform-origin:center center;
  }
  #bg{ position:fixed; inset:0; z-index:-2; background-size:cover; background-position:center;
       opacity:0; transition:opacity .3s ease .4s; pointer-events:none; filter:blur(3px); transform:scale(1.06); }
  #bg.on{ opacity:1; }
  #screen-menu .center{ opacity:0; transition:opacity .35s ease 1s; }
  body.bg-ready #screen-menu .center{ opacity:1; }
  #bgShade{ position:fixed; inset:0; z-index:-1; background:#0a0c14; opacity:0; transition:opacity 1.2s ease; pointer-events:none; }
  body.has-bg #bgShade{ opacity:var(--bg-dark, .78); }
  body.has-bg .q-title, body.has-bg .sub, body.has-bg .brand, body.has-bg .tagline,
  body.has-bg .set-label, body.has-bg .diffhint, body.has-bg #topicTitle, body.has-bg .wb-title,
  body.has-bg .qb-title, body.has-bg .qd-title, body.has-bg .hint{ text-shadow:0 2px 10px rgba(0,0,0,.72); }
  /* Confirm dialog buttons — high contrast so "Yes" never blends in */
  #confirmYes{ background:linear-gradient(180deg,#F5BE52,#DE9A1F); color:#241a05;
               border:2px solid #9a6f16; box-shadow:0 8px 22px rgba(0,0,0,.35); font-weight:900; }
  #confirmNo{ background:var(--panel2); color:var(--ink); border:2px solid var(--line); font-weight:800; }
  body.kbd #confirmYes.focused{ box-shadow:0 0 0 4px var(--focus), 0 8px 22px rgba(0,0,0,.35); }
  .screen{display:none; flex:1; min-height:0; flex-direction:column; overflow-y:auto; overflow-x:hidden}
  .screen.active{display:flex}
  .screen::-webkit-scrollbar{width:10px}
  .screen::-webkit-scrollbar-thumb{background:var(--line); border-radius:999px}

  /* Wordmark */
  .brand{
    font-weight:800; letter-spacing:.28em; text-transform:uppercase;
    font-size:clamp(20px,3.2vw,44px); line-height:1;
    color:var(--ink);
  }
  .brand b{color:var(--gold)}
  .brand .num{
    display:inline-block; margin-left:.15em;
    color:var(--bg); background:var(--gold);
    padding:.08em .3em; border-radius:.18em; letter-spacing:.05em;
    box-shadow:0 0 0 3px rgba(242,177,56,.25);
  }
  .tagline{color:var(--muted); font-size:clamp(12px,1.4vw,18px); letter-spacing:.22em; text-transform:uppercase; margin-top:.7em}

  /* Generic centered card layout */
  .center{flex:none; min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:clamp(18px,3vh,40px); padding:clamp(10px,2vh,24px) 0}
  .center>*:first-child{margin-top:auto}
  .center>*:last-child{margin-bottom:auto}
  .stack{display:flex; flex-direction:column; align-items:center; gap:clamp(14px,2.4vh,28px); width:100%}

  h2.q-title{font-size:calc(clamp(22px,3vw,40px) * var(--fs)); font-weight:800; letter-spacing:.02em; text-align:center}
  .sub{color:var(--muted); font-size:clamp(13px,1.5vw,20px); text-align:center; max-width:60ch}

  /* Focusable buttons */
  .btn{
    position:relative;
    background:var(--panel);
    border:2px solid var(--line);
    color:var(--ink);
    border-radius:16px;
    font-size:calc(clamp(18px,2.1vw,30px) * var(--fs));
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease, border-color .15s ease;
    outline:none;
    display:inline-flex; align-items:center; justify-content:center; gap:.5em;
  }
  .btn .k{color:var(--muted); font-weight:600; font-size:.7em}
  .btn.wide{width:min(560px,80vw)}
  .btn.ghost{background:transparent}
  .btn.gold{background:linear-gradient(180deg,#F5BE52,#E09B22); border-color:#caa23f; color:#241a05}
  .btn.good{background:linear-gradient(180deg,#3ee0a6,#25b487); border-color:#2aa87f; color:#062018}
  body.kbd .btn.focused{
    border-color:var(--focus);
    background:var(--panel2);
    box-shadow:inset 0 0 0 3px var(--focus);
  }
  body.kbd .btn.gold.focused{background:linear-gradient(180deg,#FFD277,#F0AB2E)}
  body.kbd .btn.good.focused{background:linear-gradient(180deg,#57efb6,#2fc793)}

  .row{display:flex; gap:clamp(12px,1.6vw,22px); flex-wrap:wrap; justify-content:center; align-items:center}

  /* Language screen big flags */
  .lang-row{display:flex; gap:clamp(14px,2.2vw,32px); flex-wrap:wrap; justify-content:center}
  .lang{
    width:min(280px,28vw); aspect-ratio:4/3;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  .lang .flag{font-size:clamp(48px,8vw,110px); line-height:1}
  .lang .name{font-size:clamp(20px,2.4vw,34px); font-weight:800; letter-spacing:.06em}

  /* Setup steppers */
  .stepper{display:flex; align-items:center; gap:clamp(16px,2vw,30px)}
  .stepper .val{min-width:2.4ch; text-align:center; font-size:clamp(40px,6vw,86px); font-weight:800; color:var(--gold)}
  .stepper .val small{display:block; font-size:.28em; color:var(--muted); letter-spacing:.2em; text-transform:uppercase; font-weight:700; margin-top:.4em}
  .arrow{
    width:clamp(56px,7vw,86px); height:clamp(56px,7vw,86px); border-radius:50%;
    background:var(--panel); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(26px,3vw,40px); cursor:pointer; color:var(--ink);
  }
  body.kbd .arrow.focused{border-color:var(--focus); background:var(--panel2); transform:scale(1.08); box-shadow:0 0 0 4px rgba(255,224,138,.35)}
  /* slider with -/+ stepper buttons (remote-friendly) */
  .sliderwrap{display:flex; align-items:center; gap:clamp(8px,1.4vw,16px); width:min(560px,100%)}
  .sliderwrap .slider{flex:1; width:auto}
  .arrow.sarrow{width:clamp(46px,5.5vw,64px); height:clamp(46px,5.5vw,64px); font-size:clamp(24px,2.8vw,34px); flex:none; font-weight:800}

  /* GAME screen */
  #screen-game{gap:clamp(10px,1.6vh,20px)}
  .scorebar{display:flex; gap:clamp(8px,1vw,14px); flex-wrap:wrap; align-items:stretch}
  .pchip{
    flex:1 1 0; min-width:90px;
    background:var(--panel); border:2px solid var(--line); border-radius:12px;
    padding:clamp(8px,1.1vh,14px) clamp(10px,1vw,16px);
    display:flex; flex-direction:column; gap:2px; position:relative; overflow:hidden;
  }
  .pchip .pname{font-size:clamp(12px,1.3vw,18px); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--muted)}
  .pchip .pscore{font-size:calc(clamp(22px,2.6vw,40px) * var(--fs)); font-weight:800; line-height:1}
  .pchip .bar{position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--c)}
  .pchip.active{border-color:var(--c); background:var(--panel2); box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 40%, transparent)}
  .pchip.active .pname{color:var(--ink)}
  .pchip.out{opacity:.5}
  .pchip .tag{position:absolute; right:8px; top:6px; font-size:clamp(10px,1vw,13px); font-weight:800; letter-spacing:.04em}
  .pchip.passed .tag{color:var(--good)}
  .pchip.busted .tag{color:var(--bad)}
  /* Topic screen: round card (left of player 1) + running scores */
  .pchip.roundchip{ flex:0 0 auto; min-width:auto; align-items:center; justify-content:center;
                    background:color-mix(in srgb, var(--gold) 16%, var(--panel)); border-color:var(--gold) }
  .pchip.roundchip .pname{ color:var(--gold) }
  .pchip.roundchip .pscore{ color:var(--gold); font-size:calc(clamp(26px,3.2vw,44px) * var(--fs)) }
  .topic-scorebar{ width:min(1100px,100%); margin:0 auto clamp(14px,2.4vh,22px) }

  .qhead{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:clamp(4px,.8vh,10px)}
  .turnwrap{display:flex; align-items:center; gap:clamp(8px,1.2vw,16px); min-width:0}
  .langflag{
    flex:none; cursor:pointer; background:var(--panel); border:2px solid var(--line);
    border-radius:12px; padding:clamp(4px,.7vh,8px) clamp(8px,1vw,12px);
    font-size:calc(clamp(20px,2.4vw,32px) * var(--fs)); line-height:1;
  }
  body.kbd .langflag.focused{border-color:var(--focus); box-shadow:0 0 0 4px rgba(255,224,138,.4); background:var(--panel2)}
  .topic-head{display:flex; align-items:center; justify-content:center; gap:clamp(10px,1.6vw,20px); flex-wrap:wrap}
  /* When flag emoji aren't supported (Windows), language codes show instead — make them clearly legible */
  body.nofe .corner-flag, body.nofe .langflag, body.nofe #langFlagTopic, body.nofe .pack-flags{
    color:#fff; font-weight:800; letter-spacing:.06em;
  }
  body.nofe .lang .flag{ color:var(--focus); font-weight:800; letter-spacing:.04em; margin-right:.15em }
  .turnlabel{color:var(--muted); font-size:clamp(13px,1.5vw,20px); letter-spacing:.06em}
  .turnlabel b{color:var(--c-turn,var(--gold))}
  .roundbank{
    font-size:clamp(14px,1.7vw,22px); font-weight:800;
    background:rgba(242,177,56,.14); color:var(--gold);
    border:1px solid var(--gold-dim); padding:.35em .8em; border-radius:999px; white-space:nowrap;
  }
  .category{
    font-size:calc(clamp(22px,3.1vw,46px) * var(--fs)); font-weight:800; letter-spacing:.01em;
    line-height:1.1; margin:clamp(2px,.6vh,8px) 0 clamp(6px,1vh,14px);
  }
  .category .pick{color:var(--gold)}

  .cat-img{ width:1em; height:1em; object-fit:cover; border-radius:4px; vertical-align:middle; display:inline-block }
  .board{
    flex:1; min-height:0;
    display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr;
    gap:clamp(8px,1.1vw,16px);
    transition:opacity .16s ease;
  }
  .opt{
    position:relative;
    background:var(--panel); border:2px solid var(--line); border-radius:14px;
    display:flex; align-items:center; gap:clamp(10px,1.2vw,18px);
    padding:0 clamp(14px,1.6vw,26px);
    font-size:calc(clamp(18px,2.6vw,34px) * var(--fs)); font-weight:700; cursor:pointer;
    transition:transform .07s ease, border-color .12s ease, background .12s ease;
    overflow:hidden;
  }
  .opt .idx{
    flex:none; width:1.9em; height:1.9em; border-radius:9px;
    background:var(--panel2); color:var(--muted);
    display:flex; align-items:center; justify-content:center;
    font-size:.72em; font-weight:800;
  }
  .opt .txt{flex:1; min-width:0; white-space:normal; overflow-wrap:break-word; word-break:normal; line-height:1.12}
  body.kbd .opt.focused{border-color:var(--focus); background:var(--panel2); box-shadow:inset 0 0 0 4px var(--focus); z-index:2}
  /* Unanswered: current player's colour as a thick left bar + light tint (turn indicator) */
  .opt:not(.claimed):not(.wrong){ border-color:var(--pc,var(--line)); background:color-mix(in srgb, var(--pc, transparent) 20%, var(--panel)); box-shadow:inset 8px 0 0 var(--pc,var(--line)) }
  .opt:not(.claimed):not(.wrong) .idx{ background:var(--pc,var(--panel2)); color:#0c1226 }
  /* Answered: keep the answerer's colour in the fill; right/wrong shown by a round badge + bar */
  .opt.claimed{border-color:var(--c,var(--line)); background:color-mix(in srgb, var(--c, transparent) 48%, var(--panel)); box-shadow:inset 8px 0 0 var(--good)}
  .opt.claimed .idx{background:var(--c,var(--panel2)); color:#0c1226}
  .opt.claimed .txt{color:var(--ink)}
  .opt.wrong{border-color:var(--c,var(--line)); background:color-mix(in srgb, var(--c, transparent) 48%, var(--panel)); box-shadow:inset 8px 0 0 var(--bad)}
  .opt.wrong .idx{background:var(--c,var(--panel2)); color:#0c1226}
  .opt.wrong .txt{color:var(--ink)}
  .opt.dim{opacity:.4}
  /* round result badge — always contrasts with the player colour */
  .opt .tick{margin-left:auto; flex:none; width:1.7em; height:1.7em; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1em; font-weight:900; box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .opt.claimed .tick{background:var(--good); color:#08240f}
  .opt.wrong .tick{background:var(--bad); color:#2a0808}

  .actions{display:flex; gap:clamp(10px,1.4vw,20px); justify-content:center; margin-top:clamp(4px,.8vh,10px)}
  /* larger, clearer Back buttons */
  .btn.back{min-width:12ch; padding:clamp(15px,2.3vh,26px) clamp(38px,6vw,68px); font-size:calc(clamp(18px,2.2vw,28px) * var(--fs)); font-weight:800}
  .btn.num{flex:0 0 auto; min-width:3.4ch; padding:clamp(14px,2vh,22px) clamp(24px,3.4vw,40px); font-size:calc(clamp(24px,2.8vw,38px) * var(--fs)); font-weight:800; border-radius:16px}
  .btn.num.gold{background:linear-gradient(180deg,#F5BE52,#E09B22); border-color:#caa23f; color:#241a05}

  /* difficulty buttons — colour coded, clear selected state */
  .btn.diff{flex:0 0 auto; border-width:2px; font-weight:800; padding:clamp(13px,2vh,22px) clamp(22px,3vw,40px); font-size:calc(clamp(17px,2.1vw,28px) * var(--fs)); border-radius:14px; border-color:var(--line); color:var(--muted); background:var(--panel)}
  .btn.diff.sel::before{content:"✓ "}
  .btn.diff.sel[data-v="easy"]{background:var(--good); color:#06251b; border-color:var(--good)}
  .btn.diff.sel[data-v="normal"]{background:#2e6fd6; color:#ffffff; border-color:#2e6fd6}
  .btn.diff.sel[data-v="hard"]{background:var(--bad); color:#2a0808; border-color:var(--bad)}
  body.kbd .btn.diff.focused{box-shadow:inset 0 0 0 3px var(--focus); border-color:var(--focus)}
  .diffhint{color:var(--muted); font-size:calc(clamp(12px,1.4vw,17px) * var(--fs)); margin:-4px 0 10px; text-align:center}
  body.kbd .btn.diff.sel[data-v="easy"].focused{background:var(--good)}
  body.kbd .btn.diff.sel[data-v="normal"].focused{background:var(--gold)}
  body.kbd .btn.diff.sel[data-v="hard"].focused{background:var(--bad)}
  body.kbd .btn.diff.sel[data-v="all"].focused{background:var(--muted)}
  /* Pass & bank button — clear, distinct */
  #passBtn{min-width:14ch; padding:clamp(15px,2.2vh,24px) clamp(30px,4.5vw,56px); font-size:calc(clamp(18px,2.2vw,28px) * var(--fs)); font-weight:800; border-radius:16px; box-shadow:0 6px 20px rgba(0,0,0,.4)}

  /* Toast / turn banner */
  .banner{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(6,10,22,.72); z-index:50; backdrop-filter:blur(3px);
  }
  .banner.show{display:flex}
  .banner .card{
    background:var(--panel); border:2px solid var(--line); border-radius:22px;
    padding:clamp(28px,4vh,56px) clamp(34px,5vw,72px); text-align:center;
    max-width:80vw; box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .banner .big{font-size:clamp(30px,5vw,64px); font-weight:800; line-height:1.05}
  .banner .mid{font-size:clamp(18px,2.4vw,34px); color:var(--muted); margin-top:.6em}
  .banner .pts{font-size:clamp(40px,7vw,96px); font-weight:800; margin:.2em 0}
  .banner .good{color:var(--good)} .banner .bad{color:var(--bad)} .banner .gold{color:var(--gold)}

  /* Win confetti-ish crown */
  .crown{font-size:clamp(50px,9vw,120px); line-height:1}
  .corner-flag{
    position:fixed; top:clamp(8px,1.6vh,20px); left:clamp(8px,1.6vw,22px); z-index:30;
    background:var(--panel); border:2px solid var(--line); border-radius:12px;
    padding:clamp(4px,.7vh,8px) clamp(9px,1.1vw,13px); line-height:1; cursor:pointer;
    font-size:calc(clamp(22px,2.6vw,34px) * var(--fs));
  }
  body.kbd .corner-flag.focused{ border-color:var(--focus); box-shadow:0 0 0 4px rgba(255,224,138,.45); background:var(--panel2); }
  /* Home-screen flag: larger, easier to hit */
  #menuFlag, #modeFlag{ padding:clamp(8px,1.3vh,14px) clamp(16px,1.8vw,24px); border-radius:16px;
             font-size:calc(clamp(34px,4.2vw,52px) * var(--fs)); }
  /* Rules screen */

  .qb-head{ display:flex; align-items:center; gap:12px; margin:6px 0 14px; flex-wrap:wrap }

              border:2px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink);
              font-size:calc(clamp(15px,1.8vw,22px) * var(--fs)); font-weight:600; outline:none }

  /* size slider */
  .slider{display:flex; align-items:center; gap:clamp(12px,1.6vw,20px); width:min(520px,100%); padding:10px 8px; cursor:pointer; border-radius:14px; border:2px solid transparent}

const sfx={
  correct(){ tone(660,0.12,'sine',0.28,0); tone(988,0.20,'sine',0.24,0.09); },

function soundTick(){
  if(!room) return;
  const ph=room.phase, q=room.q; const ans=(q&&q.answererPid)?q.answererPid:(room.answererPid||'');
  if(ph==='category' && room.pickerPid===ME && snd.pk!==room.pickerPid) vibrate(180);
  snd.pk = (ph==='category') ? room.pickerPid : null;
  if(room.simul){
    const my=(q&&q.picks&&q.picks[ME])||[]; const myRes=(q&&q.results&&q.results[ME])||[];
    if(ph==='question' && snd.phase!=='question'){ snd.myLen=0; if(findP(ME)) sfx.turn(); }
    if(my.length > (snd.myLen||0)){ const last=myRes[myRes.length-1]; if(last) sfx.correct(); else sfx.wrong(); }
    snd.myLen=my.length; snd.phase=ph; return;
  }
  if(room.mode==='sweep'){
    if(ph==='category'){ snd.sclaim=0; snd.swrong=0; }
    if(q && q.optState){
      const cl=q.optState.filter(x=>x==='claimed').length, wr=q.optState.filter(x=>x==='wrong').length;
      if(cl>(snd.sclaim||0)) sfx.correct();

    }
    if(ph==='question' && ans===ME && (snd.phase!=='question' || ans!==snd.ans)){ sfx.turn(); vibrate(180); }
    if(ph==='win' && snd.phase!=='win') sfx.win();
    snd.phase=ph; snd.ans=ans; return;
  }
  const fl=q?q.failed.length:0;
  if(ph==='question' && snd.phase!=='question'){ snd.failed=0; snd.revealed=false; }
  if(fl>snd.failed){ sfx.wrong(); }
  if(ph==='reveal' && !snd.revealed && q && q.winnerPid){ snd.revealed=true; sfx.correct(); }
  if(ph==='question' && ans===ME && (snd.phase!=='question' || ans!==snd.ans)){ sfx.turn(); vibrate(180); }
  if(ph==='win' && snd.phase!=='win'){ sfx.win(); }
  snd.phase=ph; snd.ans=ans; snd.failed=fl;
}

/* ---------- Sweep round (push-your-luck) ---------- */
function startSweep(){
  room.lang='fi'; room.langs=(poolLangs&&poolLangs.length)?poolLangs.slice():['fi'];
  room.scores={}; room.players.forEach(p=>room.scores[p.id]=0);
  room.catStarterSeat=0; room.winnerPid=null; used=new Set();
  room.suddenDeath=false; room.sdPlayers=[];
  beginCategory();
}
function firstActiveFrom(status, seat){
  const n=room.players.length;
  for(let k=0;k<n;k++){ const p=room.players[(seat+k)%n]; if(p && status[p.id]==='active') return p.id; }
  return null;
}
function startSweepRound(){
  curQ=drawFromTopic(room.currentTopic);
  const L=room.langs||['fi']; const status={},tokens={};
  room.players.forEach(p=>{ status[p.id] = (room.suddenDeath && room.sdPlayers.indexOf(p.id)<0) ? 'eliminated' : 'active'; tokens[p.id]=0; });
  const ans=firstActiveFrom(status, room.catStarterSeat%room.players.length);
  room.phase='question';
  room.q={ mode:'sweep', catML:curQ.cat,
    optsML:curQ.opts.map(o=>{ const m={}; L.forEach(l=>m[l]=o[l]||''); return m; }),
    optState:curQ.opts.map(()=>'idle'), optBy:curQ.opts.map(()=>null),
    status, tokens, answererPid:ans, roundOver:false };
  setDeadline(); pushState();
}
function sweepPick(pid, idx){
  if(room.phase!=='question' || !room.q || room.q.mode!=='sweep' || pid!==room.q.answererPid) return;
  if(typeof idx!=='number' || idx<0 || idx>=curQ.opts.length) return;
  if(room.q.optState[idx]!=='idle') return;
  const p=findP(pid); if(p) p.misses=0;
  if(curQ.opts[idx].correct){ room.q.optState[idx]='claimed'; room.q.optBy[idx]=pid; room.q.tokens[pid]=(room.q.tokens[pid]||0)+1; }
  else { room.q.optState[idx]='wrong'; room.q.optBy[idx]=pid; room.q.tokens[pid]=0; room.q.status[pid]='busted'; }
  sweepAdvance();
}
function sweepPass(pid){
  if(room.phase!=='question' || !room.q || room.q.mode!=='sweep' || pid!==room.q.answererPid) return;
  const p=findP(pid); if(p) p.misses=0;
  room.scores[pid]=(room.scores[pid]||0)+(room.q.tokens[pid]||0);
  room.q.status[pid]='passed';
  sweepAdvance();
}
function sweepAdvance(){
  const anyActive=room.players.some(p=>room.q.status[p.id]==='active');
  const idleLeft=room.q.optState.some(x=>x==='idle');
  if(!anyActive || !idleLeft){ sweepEndRound(); return; }
  const n=room.players.length; const curIdx=room.players.findIndex(p=>p.id===room.q.answererPid);
  for(let k=1;k<=n;k++){ const c=room.players[((curIdx<0?0:curIdx)+k)%n]; if(c && room.q.status[c.id]==='active'){ room.q.answererPid=c.id; setDeadline(); pushState(); return; } }
  sweepEndRound();
}
function sweepEndRound(){
  room.players.forEach(p=>{ if(room.q.status[p.id]==='active'){ room.scores[p.id]=(room.scores[p.id]||0)+(room.q.tokens[p.id]||0); room.q.status[p.id]='passed'; } });
  room.q.roundOver=true; room.phase='reveal'; clearDeadline(); pushState();
  setTimeout(sweepAfterRound, 1700);
}
function sweepAfterRound(){
  if(room.phase==='win') return;
  if(room.suddenDeath){
    const smax=Math.max(...room.sdPlayers.map(id=>room.scores[id]||0));
    const leaders=room.sdPlayers.filter(id=>(room.scores[id]||0)===smax);
    if(leaders.length===1){ doWin(leaders[0]); return; }
    room.catStarterSeat=nextSdSeat(room.catStarterSeat);
    beginCategory(); return;
  }
  const max=Math.max(...room.players.map(p=>room.scores[p.id]||0));
  const reached=room.players.some(p=>(room.scores[p.id]||0)>=room.target);
  if(reached){
    const top=room.players.filter(p=>(room.scores[p.id]||0)===max);
    if(top.length===1){ doWin(top[0].id); return; }
    startSuddenDeath(top.map(p=>p.id)); return;
  }
  room.catStarterSeat=(room.catStarterSeat+1)%room.players.length;
  beginCategory();
}
function startSuddenDeath(tied){
  room.suddenDeath=true; room.sdPlayers=tied.slice();
  const startId=tied[Math.floor(Math.random()*tied.length)];
  room.catStarterSeat=room.players.findIndex(p=>p.id===startId);
  beginCategory();
}
function nextSdSeat(seat){
  const n=room.players.length;
  for(let k=1;k<=n;k++){ const idx=(seat+k)%n; const p=room.players[idx]; if(p && room.sdPlayers.indexOf(p.id)>=0) return idx; }
  return seat;
}

/* ---------- Simultaneous "everyone answers at once" mode ---------- */
function startSimul(){
  room.lang='fi'; room.langs=(poolLangs&&poolLangs.length)?poolLangs.slice():['fi'];
  room.scores={}; room.players.forEach(p=>room.scores[p.id]=0);
  room.catStarterSeat=0; room.winnerPid=null; used=new Set();
  room.suddenDeath=false; room.sdPlayers=[];
  beginCategory();
}
function startSimulRound(){
  curQ=drawFromTopic(room.currentTopic);
  const L=room.langs||['fi']; const picks={},results={},busted={},locked={},tokens={},continued={};
  room.players.forEach(p=>{ picks[p.id]=[]; results[p.id]=[]; busted[p.id]=false; locked[p.id]=false; tokens[p.id]=0; continued[p.id]=false; });
  room.phase='question';
  room.q={ mode:room.mode, simul:true, catML:curQ.cat,
    optsML:curQ.opts.map(o=>{ const m={}; L.forEach(l=>m[l]=o[l]||''); return m; }),
    picks, results, busted, locked, tokens, continued, revealed:false, optReveal:null };
  setDeadline(); pushState();
}
function onSimulPick(pid, i){
  const q=room.q;
  if(room.phase!=='question' || !q || !q.simul || q.revealed || !findP(pid)) return;
  if(q.locked[pid] || q.busted[pid]) return;
  if(typeof i!=='number' || i<0 || i>=curQ.opts.length) return;
  if(q.picks[pid].includes(i)) return;
  const correct = !!curQ.opts[i].correct;
  q.picks[pid].push(i); q.results[pid].push(correct);
  if(room.mode==='bullseye'){ q.locked[pid]=true; }
  else { if(correct){ q.tokens[pid]++; } else { q.busted[pid]=true; q.locked[pid]=true; } }
  const p=findP(pid); if(p) p.misses=0;
  if(room.players.every(pp=>q.locked[pp.id])) simulReveal(); else pushState();
}
function onSimulBank(pid){
  const q=room.q;
  if(room.phase!=='question' || !q || !q.simul || q.revealed || !findP(pid) || q.locked[pid]) return;
  q.locked[pid]=true; const p=findP(pid); if(p) p.misses=0;
  if(room.players.every(pp=>q.locked[pp.id])) simulReveal(); else pushState();
}
function onSimulCont(pid){
  const q=room.q;
  if(room.phase!=='reveal' || !q || !q.simul || !findP(pid)) return;
  q.continued[pid]=true;
  if(room.players.every(pp=>q.continued[pp.id])) simulAfterRound(); else pushState();
}
function simulReveal(){
  clearDeadline(); const q=room.q;
  const cset=new Set(curQ.opts.map((o,i)=>o.correct?i:-1).filter(i=>i>=0));
  room.players.forEach(p=>{
    if(room.mode==='bullseye'){ const pk=q.picks[p.id]||[]; if(pk.length && cset.has(pk[0])) room.scores[p.id]=(room.scores[p.id]||0)+1; }
    else { if(!q.busted[p.id]) room.scores[p.id]=(room.scores[p.id]||0)+(q.tokens[p.id]||0); }
  });
  const optReveal={}; const picked=new Set();
  room.players.forEach(p=>(q.picks[p.id]||[]).forEach(i=>picked.add(i)));
  picked.forEach(i=>{ optReveal[i]=cset.has(i); });
  q.optReveal=optReveal; q.revealed=true; room.phase='reveal';
  const secs = room.timeLimit>0 ? room.timeLimit : 20;
  room.endsAt = Date.now() + secs*1000;
  pushState();
}
function simulAfterRound(){
  if(room.phase==='win') return;
  clearDeadline();
  const max=Math.max(...room.players.map(p=>room.scores[p.id]||0));
  if(room.players.some(p=>(room.scores[p.id]||0)>=room.target)){ const top=room.players.filter(p=>(room.scores[p.id]||0)===max); if(top.length===1){ doWin(top[0].id); return; } }
  room.catStarterSeat=(room.catStarterSeat+1)%room.players.length;
  beginCategory();
}
function simulPick(i){ if(iamHost) onSimulPick(ME,i); else net.send({t:'action',a:'spick',idx:i,id:ME}); }
function simulBank(){ if(iamHost) onSimulBank(ME); else net.send({t:'action',a:'sbank',id:ME}); }
function simulCont(){ if(iamHost) onSimulCont(ME); else net.send({t:'action',a:'scont',id:ME}); }
function renderSimul(){
  const q=room.q; if(!q) return;
  const reveal = room.phase==='reveal' || q.revealed;
  const iAmPlayer = !!findP(ME);
  const meLocked = iAmPlayer && q.locked && q.locked[ME];
  const meBusted = iAmPlayer && q.busted && q.busted[ME];
  const canPick = iAmPlayer && !reveal && !meLocked && !meBusted && !meAway();
  $('#qText').textContent = pickMy(q.catML); updateFlags();
  const wrap=$('#qOpts'); wrap.innerHTML='';
  const myIdx=room.players.findIndex(p=>p.id===ME);
  wrap.style.setProperty('--pc', (!reveal && myIdx>=0)?playerColor(myIdx):'');
  const myPk=(q.picks && q.picks[ME])||[]; const myRes=(q.results && q.results[ME])||[];
  q.optsML.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML='<span class="idx">'+(i+1)+'</span><span class="txt">'+esc(pickMy(o))+'</span><span class="tick"></span>';
    const tick=b.querySelector('.tick');
    if(reveal){
      const pickers=room.players.filter(p=>(q.picks[p.id]||[]).includes(i));
      if(pickers.length){
        const correct = q.optReveal && q.optReveal[i];
        b.classList.add(correct?'claimed':'wrong'); tick.textContent = correct?'✓':'✕';
        const dots=document.createElement('span'); dots.className='pdots';
        pickers.forEach(pp=>{ const d=document.createElement('span'); d.className='pdot'; d.style.background=playerColor(room.players.findIndex(x=>x.id===pp.id)); dots.appendChild(d); });
        b.appendChild(dots);
      }
      b.disabled=true;
    } else {
      const k=myPk.indexOf(i);
      if(k>=0){ const ok=myRes[k]; b.classList.add(ok?'claimed':'wrong'); tick.textContent = ok?'✓':'✕'; }
      b.disabled=!canPick; if(canPick) b.onclick=()=>simulPick(i);
    }
    wrap.appendChild(b);
  });
  const turn=$('#qTurn'); turn.innerHTML='';
  const lc=q.locked?Object.values(q.locked).filter(Boolean).length:0; const tot=room.players.length;
  const cc=q.continued?Object.values(q.continued).filter(Boolean).length:0;
  if(reveal){ turn.textContent = t('roundOver')+' — '+t('waitingCount', cc+'/'+tot); }
  else if(meAway()){ turn.appendChild(returnBtn()); }
  else if(!iAmPlayer){ turn.textContent = t('waitingCount', lc+'/'+tot); }
  else if(meBusted){ turn.innerHTML='<b>'+esc(t('bustedMsg'))+'</b> — '+t('waitingCount', lc+'/'+tot); }
  else if(meLocked){ turn.textContent = t('locked')+' — '+t('waitingCount', lc+'/'+tot); }
  else { turn.innerHTML='<b>'+esc(t('answerNow'))+'</b>'; }
  const pass=$('#qPass'), lock=$('#qLock');
  if(pass){ if(!reveal && room.mode==='sweep' && iAmPlayer){ pass.style.display=''; const tk=q.tokens[ME]||0; pass.textContent='💰 '+t('pass')+(tk>0?' ('+tk+')':''); pass.disabled=!canPick; pass.onclick = canPick ? (()=>simulBank()) : null; } else { pass.style.display='none'; pass.disabled=false; } }
  if(lock){ if(reveal && iAmPlayer && !q.continued[ME]){ lock.style.display=''; lock.textContent='▶ '+t('continueBtn'); lock.onclick=()=>simulCont(); } else lock.style.display='none'; }
  renderChips('#qScores');
}

function renderGame(){
  if(!room || !room.started) return;
  if(room.langs && room.langs.indexOf(myLang)<0) myLang=room.langs[0]||'fi';
  const ph=room.phase;
  const pb=$('#qPass'); if(pb) pb.style.display='none'; const lb=$('#qLock'); if(lb) lb.style.display='none';
  if(room.simul){ if(ph==='question' && simSeenPhase!=='question'){ myPicks=[]; vibrate(180); } simSeenPhase=ph; }
  if(ph==='win'){ show('view-win'); renderWin(); }
  else if(ph==='category'){ show('view-cat'); renderCat(); }
  else { show('view-q'); if(room.simul) renderSimul(); else if(room.mode==='sweep') renderSweep(); else renderQ(); }
  soundTick();
  startCountdownDisplay();
}
function renderCat(){
  const picker=findP(room.pickerPid); const iAmPicker=(room.pickerPid===ME)&&!meAway();
  updateFlags();
  const sd = room.suddenDeath ? t('suddenDeath') : '';
  $('#catPrompt').textContent = sd + (iAmPicker ? t('chooseCategory') : t('picksCategory', pdName(picker)));
  const grid=$('#catGrid'); grid.innerHTML=''; const wait=$('#catWait'); wait.innerHTML='';
  if(meAway()){ wait.appendChild(returnBtn()); }
  else if(iAmPicker){
    (room.availTopics||[]).forEach(t=>{ const b=document.createElement('button'); b.className='btn topic focusable'; b.innerHTML='<span class="ticon">'+esc(t.icon||'')+'</span><span class="tlabel">'+esc(pickMy(t.nameML))+'</span>'; b.onclick=()=>sendPick(t.key); grid.appendChild(b); });
  } else { wait.innerHTML='<span class="waitpulse"></span>'+esc(t('waitCategory')); }
  renderChips('#catScores');
}
function renderQ(){
  const q=room.q; if(!q) return;
  const reveal=(room.phase==='reveal'); const meAns=(room.answererPid===ME)&&!reveal&&!meAway();
  $('#qText').textContent = pickMy(q.catML);
  updateFlags();
  const wrap=$('#qOpts'); wrap.innerHTML='';
  const ansIdx=room.players.findIndex(p=>p.id===room.answererPid);
  wrap.style.setProperty('--pc', ansIdx>=0?playerColor(ansIdx):'');
  q.optsML.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML='<span class="idx">'+(i+1)+'</span><span class="txt">'+esc(pickMy(o))+'</span><span class="tick"></span>';
    const tick=b.querySelector('.tick');
    if(q.failed.includes(i)){
      b.classList.add('wrong'); tick.textContent='✕'; b.disabled=true;
      const fb=q.failedBy&&q.failedBy[i]; const fi=fb?room.players.findIndex(p=>p.id===fb):-1;
      if(fi>=0) b.style.setProperty('--c', playerColor(fi));
    } else if(reveal){
      if(q.correctIdx!=null && i===q.correctIdx){ b.classList.add('claimed'); const wi=room.players.findIndex(p=>p.id===q.winnerPid); if(wi>=0) b.style.setProperty('--c',playerColor(wi)); tick.textContent='✓'; }
      /* idle options: left untouched — the game never dims them */
      b.disabled=true;
    } else { b.disabled=!meAns; if(meAns) b.onclick=()=>sendAnswer(i); }
    wrap.appendChild(b);
  });
  const ans=findP(room.answererPid); const turn=$('#qTurn'); turn.innerHTML='';
  if(reveal){ turn.textContent = q.winnerPid ? t('xCorrect', pdName(findP(q.winnerPid))) : t('nobody'); }
  else if(meAway()){ turn.appendChild(returnBtn()); }
  else { turn.innerHTML = meAns ? '<b>'+esc(t('yourTurn'))+'</b>' : esc(t('xAnswers', pdName(ans))); }
  renderChips('#qScores');
}
function renderWin(){ const w=findP(room.winnerPid); $('#winName').innerHTML='🏆 '+esc(w?pdName(w):t('winner')); renderChips('#winScores'); }
function renderPlayers(sel){ renderChips(sel); }
function renderHost(){
  $('#hostCode').textContent=room.code;
  const link=joinURL(room.code); $('#joinLink').value=link; drawQR(link);
  renderChips('#hostPlayers', true); const hc=$('#hostCtl'); if(hc) hc.innerHTML='';
  const enough=room.players.length>=2;
  $('#startGame').disabled=!enough;
  const spec = room.hostPlays===false;
  $('#startHint').textContent = enough ? (spec?t('spectating'):t('ready')) : t('needTwo');
}
function startCountdownDisplay(){
  clearInterval(cdTimer);
  const tick=()=>{
    const noLimit=!room||room.endsAt==null;
    const rem=(room&&room.endsAt)?Math.max(0,Math.ceil((room.endsAt-Date.now())/1000)):null;
    const hide=room&&((room.phase==='reveal'&&!room.simul)||room.phase==='win');
    const txt=hide?'':(noLimit?'∞':(rem+' s'));
    ['#catTimer','#qTimer'].forEach(s=>{ const el=$(s); if(el){ el.textContent=txt; el.classList.toggle('low', rem!=null&&rem<=5); } });
  };
  tick(); cdTimer=setInterval(tick,200);
}

/* ---------- leave / cleanup ---------- */
function leaveAll(){
  try{ if(iamHost){ net.send({t:'end'}); }
       else if(room){ net.send({t:'leave', id:ME}); } }catch(e){}
  clearInterval(heartbeat); clearInterval(hostTick); clearInterval(cdTimer); clearTimeout(stateWaitTimer);
  net.close(); room=null; iamHost=false;
}
window.addEventListener('beforeunload', ()=>{ try{ if(!iamHost && room) net.send({t:'leave', id:ME}); }catch(e){} });

/* ---------- wire up UI ---------- */
$('#verLabel').textContent = 'v'+MP_VERSION;
$('#checkUpd').addEventListener('click', async ()=>{
  toast('Haetaan uusin versio…');
  try{
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    if('serviceWorker' in navigator){ const rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(x=>x.unregister().catch(()=>{}))); }
  }catch(e){}
  location.replace(location.pathname + '?u=' + Date.now());
});
$('#homeNew').addEventListener('click', ()=> toast('Ei käytössä prototyypissä'));
$('#homeMulti').addEventListener('click', ()=> show('view-mp'));
$('#mpHost').addEventListener('click', ()=>{ show('view-name-host'); setTimeout(()=>$('#hostName').focus(),50); });
$('#mpJoin').addEventListener('click', ()=>{ show('view-name-join'); setTimeout(()=>$('#joinName').focus(),50); });
document.querySelectorAll('[data-back]').forEach(b=> b.addEventListener('click', ()=> show('view-'+b.dataset.back)));

$('#createRoom').addEventListener('click', ()=>{
  const raw = ($('#hostName').value||'').trim();
  const name = raw || t('hostPh'); const def = raw ? null : 'host';
  const plays = $('#hostPlays') ? $('#hostPlays').checked : true;
  hostCreate(name, plays, def);
});
$('#doJoin').addEventListener('click', ()=>{
  const cd = ($('#joinCode').value||'').trim().toUpperCase();
  const raw = ($('#joinName').value||'').trim();
  const name = raw || t('playerPh'); const def = raw ? null : 'player';
  if(cd.length!==4){ toast('Syötä 4-merkkinen koodi'); return; }
  guestJoin(cd, name, def);
});
$('#startGame').addEventListener('click', openModeScreen);
$('#modeBack').addEventListener('click', ()=> show('view-host'));
function setTargetsForMode(mode){
  const vals = mode==='bullseye' ? [10,15,20] : [15,25,40];
  const def = mode==='bullseye' ? 15 : 25;
  hostTarget = def;
  const tp = $('#targetPick'); if(!tp) return;
  tp.innerHTML = vals.map(v=>'<button class="btn num'+(v===def?' sel':'')+'" data-t="'+v+'">'+v+'</button>').join('');
  tp.querySelectorAll('.btn').forEach(bb=> bb.addEventListener('click', ()=>{ hostTarget=+bb.dataset.t; tp.querySelectorAll('.btn').forEach(x=>x.classList.toggle('sel', x===bb)); }));
}
document.querySelectorAll('[data-startmode]').forEach(b=> b.addEventListener('click', ()=>{ hostMode=b.dataset.startmode; const mm=$('#modesetMode'); if(mm) mm.textContent = hostMode==='sweep'?'Sweep':'Bullseye'; setTargetsForMode(hostMode); applySimulTimeCap(); show('view-modeset'); }));
{ const sm=$('#startMode'); if(sm) sm.addEventListener('click', ()=> hostBegin(hostMode)); }
{ const mb=$('#modesetBack'); if(mb) mb.addEventListener('click', ()=> show('view-mode')); }
document.querySelectorAll('#targetPick .btn').forEach(b=> b.addEventListener('click', ()=>{ hostTarget=+b.dataset.t; document.querySelectorAll('#targetPick .btn').forEach(x=>x.classList.toggle('sel', x===b)); }));
function applySimulTimeCap(){ const sl=$('#timeSlider'); if(!sl) return; const sim=$('#hostSimul')&&$('#hostSimul').checked; sl.max = sim?90:95; if(sim && +sl.value>90){ sl.value=90; sl.dispatchEvent(new Event('input')); } }
{ const cs=$('#hostSimul'); if(cs) cs.addEventListener('change', applySimulTimeCap); }
document.querySelectorAll('#diffPick .btn').forEach(b=> b.addEventListener('click', ()=>{ const d=b.dataset.v; const on=!hostDiffs[d]; const cnt=Object.values(hostDiffs).filter(Boolean).length; if(!on && cnt<=1) return; hostDiffs[d]=on; b.classList.toggle('sel', on); }));
$('#copyLink').addEventListener('click', ()=>{
  const v=$('#joinLink').value;
  if(navigator.clipboard){ navigator.clipboard.writeText(v).then(()=>toast('Linkki kopioitu')).catch(()=>toast('Kopiointi ei onnistunut')); }
  else { $('#joinLink').select(); document.execCommand('copy'); toast('Linkki kopioitu'); }
});
$('#hostLeave').addEventListener('click', ()=>{ leaveAll(); show('view-home'); });
$('#guestLeave').addEventListener('click', ()=>{ leaveAll(); show('view-home'); });
document.querySelectorAll('.leaveBtn').forEach(bb=> bb.addEventListener('click', ()=>{ leaveAll(); show('view-home'); }));
try{ const sv=localStorage.getItem('mpLang'); if(sv) myLang=sv; }catch(e){}
document.querySelectorAll('.corner-flag,#catFlag,#qFlag').forEach(f=> f.addEventListener('click', cycleMyLang));
{ const vb=$('#vibeToggle'); if(vb) vb.addEventListener('click', ()=>{ vibeOn=!vibeOn; try{localStorage.setItem('mpVibe', vibeOn?'1':'0');}catch(e){} updateVibeBtn(); if(vibeOn) vibrate(60); }); }
applyUITexts(); updateFlags();
document.addEventListener('click', e=>{ audioInit(); const t=e.target; if(t.closest && t.closest('.btn, .topic, .langflag') && !t.closest('.opt')) sfx.select(); }, true);
$('#timeSlider').addEventListener('input', e=>{ const v=+e.target.value; $('#timeVal').textContent = v>90?'Ei aikarajaa':(v+' s'); });
